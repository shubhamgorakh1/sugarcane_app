{% extends "base.html" %}

{% block title %}
{{ t('add_farmer') }} - Sugarcane ERP
{% endblock %}

{% block page_heading %}
{{ t('add_farmer') }}
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>{{ t('add_farmer') }}</h2>
        <p>{{ t('add_farmer_description') }}</p>
    </div>
</div>

<div class="form-card" style="max-width: 900px;">
    <form method="POST">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
            <!-- Farmer Name -->
            <div class="form-group">
                <label for="farmer_name">{{ t('farmer_name') }} *</label>
                <input type="text" id="farmer_name" name="farmer_name" required>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">{{ t('mobile') }} *</label>
                <input type="text" id="mobile" name="mobile" required>
            </div>

            <!-- Aadhaar -->
            <div class="form-group">
                <label for="aadhaar_no">{{ t('aadhaar_no') }}</label>
                <input type="text" id="aadhaar_no" name="aadhaar_no">
            </div>

            <!-- Village -->
            <div class="form-group">
                <label for="village">{{ t('village') }} *</label>
                <input type="text" id="village" name="village" required>
            </div>

            <!-- Taluka -->
            <div class="form-group">
                <label for="taluka">{{ t('taluka') }}</label>
                <input type="text" id="taluka" name="taluka">
            </div>

            <!-- District -->
            <div class="form-group">
                <label for="district">{{ t('district') }}</label>
                <input type="text" id="district" name="district">
            </div>

            <!-- Land Account No -->
            <div class="form-group">
                <label for="land_account_no">{{ t('land_account_no') }}</label>
                <input type="text" id="land_account_no" name="land_account_no">
            </div>

            <!-- Land Area -->
            <div class="form-group">
                <label for="land_area">{{ t('land_area') }}</label>
                <input type="number" step="0.01" id="land_area" name="land_area">
            </div>

            <!-- GPS Latitude -->
            <div class="form-group">
                <label for="latitude">{{ t('latitude') }}</label>
                <input type="text" id="latitude" name="latitude">
            </div>

            <!-- GPS Longitude -->
            <div class="form-group">
                <label for="longitude">{{ t('longitude') }}</label>
                <input type="text" id="longitude" name="longitude">
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);">
            <button type="submit" class="btn-primary">
                {{ t('save_farmer') }}
            </button>
            <a href="{{ url_for('farmers') }}" class="btn-secondary">
                {{ t('cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
