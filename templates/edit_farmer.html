{% extends "base.html" %}

{% block title %}
{{ t('edit_farmer') }} - Sugarcane ERP
{% endblock %}

{% block page_heading %}
{{ t('edit_farmer') }}
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>{{ t('edit_farmer') }}</h2>
        <p>{{ t('edit_farmer_description') }}</p>
    </div>
</div>

<div class="form-card" style="max-width: 900px;">
    <form method="POST">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
            <!-- Farmer Code -->
            <div class="form-group">
                <label for="farmer_code">{{ t('farmer_code') }}</label>
                <input type="text" id="farmer_code" value="{{ farmer.farmer_code }}" readonly>
            </div>

            <!-- Farmer Name -->
            <div class="form-group">
                <label for="farmer_name">{{ t('farmer_name') }} *</label>
                <input type="text" id="farmer_name" name="farmer_name" value="{{ farmer.farmer_name or '' }}" required>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">{{ t('mobile') }} *</label>
                <input type="text" id="mobile" name="mobile" value="{{ farmer.mobile or '' }}" required>
            </div>

            <!-- Aadhaar -->
            <div class="form-group">
                <label for="aadhaar_no">{{ t('aadhaar_no') }}</label>
                <input type="text" id="aadhaar_no" name="aadhaar_no" value="{{ farmer.aadhaar_no or '' }}">
            </div>

            <!-- Village -->
            <div class="form-group">
                <label for="village">{{ t('village') }} *</label>
                <input type="text" id="village" name="village" value="{{ farmer.village or '' }}" required>
            </div>

            <!-- Taluka -->
            <div class="form-group">
                <label for="taluka">{{ t('taluka') }}</label>
                <input type="text" id="taluka" name="taluka" value="{{ farmer.taluka or '' }}">
            </div>

            <!-- District -->
            <div class="form-group">
                <label for="district">{{ t('district') }}</label>
                <input type="text" id="district" name="district" value="{{ farmer.district or '' }}">
            </div>

            <!-- Land Account Number -->
            <div class="form-group">
                <label for="land_account_no">{{ t('land_account_no') }}</label>
                <input type="text" id="land_account_no" name="land_account_no" value="{{ farmer.land_account_no or '' }}">
            </div>

            <!-- Land Area -->
            <div class="form-group">
                <label for="land_area">{{ t('land_area') }}</label>
                <input type="number" step="0.01" id="land_area" name="land_area" value="{{ farmer.land_area or '' }}">
            </div>

            <!-- GPS Latitude -->
            <div class="form-group">
                <label for="latitude">{{ t('latitude') }}</label>
                <input type="text" id="latitude" name="latitude" value="{{ farmer.latitude or '' }}">
            </div>

            <!-- GPS Longitude -->
            <div class="form-group">
                <label for="longitude">{{ t('longitude') }}</label>
                <input type="text" id="longitude" name="longitude" value="{{ farmer.longitude or '' }}">
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);">
            <button type="submit" class="btn-primary">
                {{ t('update_farmer') }}
            </button>
            <a href="{{ url_for('farmers') }}" class="btn-secondary">
                {{ t('cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
