{% extends "base.html" %}

{% block title %}
{{ t('edit_nondni') }} - Sugarcane ERP
{% endblock %}

{% block page_heading %}
{{ t('edit_nondni') }}
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>{{ t('edit_nondni') }}</h2>
        <p>{{ t('edit_nondni_description') }}</p>
    </div>
</div>

<div class="form-card" style="max-width: 860px;">
    <form method="POST">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
            <div class="form-group">
                <label>{{ t('season') }}</label>
                <input type="text" name="season" value="{{ nondni.season }}" readonly>
            </div>

            <div class="form-group">
                <label for="survey_gat_no">{{ t('survey_gat_no') }}</label>
                <input type="text" id="survey_gat_no" name="survey_gat_no" value="{{ nondni.survey_gat_no or '' }}">
            </div>

            <div class="form-group">
                <label for="planting_date">{{ t('planting_date') }}</label>
                <input type="date" id="planting_date" name="planting_date" value="{% if nondni.planting_date %}{{ nondni.planting_date.strftime('%Y-%m-%d') }}{% endif %}">
            </div>

            <div class="form-group">
                <label for="sugarcane_variety">{{ t('sugarcane_variety') }}</label>
                <input type="text" id="sugarcane_variety" name="sugarcane_variety" value="{{ nondni.sugarcane_variety or '' }}">
            </div>

            <div class="form-group">
                <label for="crop_type">{{ t('crop_type') }}</label>
                <input type="text" id="crop_type" name="crop_type" value="{{ nondni.crop_type or '' }}">
            </div>

            <div class="form-group">
                <label for="irrigation_method">{{ t('irrigation_method') }}</label>
                <input type="text" id="irrigation_method" name="irrigation_method" value="{{ nondni.irrigation_method or '' }}">
            </div>

            <div class="form-group">
                <label for="planting_area">{{ t('planting_area') }}</label>
                <input type="number" step="0.01" id="planting_area" name="planting_area" value="{{ nondni.planting_area or '' }}">
            </div>

            <div class="form-group">
                <label for="receipt_no">{{ t('receipt_no') }}</label>
                <input type="text" id="receipt_no" name="receipt_no" value="{{ nondni.receipt_no or '' }}">
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);">
            <button type="submit" class="btn-primary">
                {{ t('update_nondni') }}
            </button>
            <a href="{{ url_for('nondnis') }}" class="btn-secondary">
                {{ t('back_to_records') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
