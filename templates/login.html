    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d2918;
            overflow-x: hidden;
            min-height: 100vh;
            background-image: url(/static/images/sugarcane-field.jpg);
        }

        img{
            background-size: auto;
            border-radius: 27%;
        }

        .img-wrapper{
            max-width: 90%;
            border-radius: 80%;
        }

        .heading-font {
            font-family: 'Outfit', sans-serif;
        }

        .sc-card {
            background: rgba(255, 255, 255, 0.98);
            box-shadow:
                0 25px 60px -15px rgba(0, 0, 0, 0.35),
                0 10px 20px -5px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .sc-input {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8faf9;
            border-color: #e2e8f0;
        }

        .sc-input:focus {
            border-color: #0b6638;
            box-shadow: 0 0 0 3.5px rgba(11, 102, 56, 0.15);
            background-color: #ffffff;
        }

        .sc-btn-primary {
            background: linear-gradient(180deg, #0b6838 0%, #084c29 100%);
            box-shadow: 0 6px 18px rgba(11, 104, 56, 0.35);
            transition: all 0.2s ease;
        }

        .sc-btn-primary:hover {
            background: linear-gradient(180deg, #0d7942 0%, #0a5a31 100%);
            box-shadow: 0 8px 22px rgba(11, 104, 56, 0.45);
            transform: translateY(-1px);
        }

        .sc-btn-primary:active {
            transform: translateY(0);
        }

        .custom-checkbox:checked {
            background-color: #0b6638;
            border-color: #0b6638;
        }

        .brand-wrap {
            animation: brandFade 0.8s ease-out both;
        }

        .login-card-wrap {
            animation: cardFade 0.8s ease-out 0.12s both;
        }

        @keyframes brandFade {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardFade {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .mobile-card {
                max-width: calc(100vw - 28px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-wrap,
            .login-card-wrap {
                animation: none !important;
            }
        }
    </style>
</head>

    <div class="relative z-10 min-h-screen w-full flex flex-col justify-between px-4 sm:px-6 lg:px-12 py-6 max-w-7xl mx-auto">

        <div class="w-full my-auto py-4">


            <!-- =================================================
                 BRAND LOGO + TITLE
                 ================================================= -->

            <div class="brand-wrap flex flex-col items-center text-center mb-6 lg:mb-8">

                        src="{{ url_for('static', filename='images/sugarcane-logo.png') }}"
                        alt="Sugarcane Company"
                        class="w-full h-full object-contain drop-shadow-md"

                </div>

                    class="heading-font text-3xl sm:text-4xl lg:text-5xl font-extrabold text-[#07381e] tracking-tight leading-none drop-shadow-sm"

                    Sugarcane
                </h1>


                <p
                    class="heading-font text-xs sm:text-sm lg:text-base font-extrabold text-[#0b542e] tracking-[0.22em] uppercase mt-1"
                >
                    COMPANY MANAGEMENT
                </p>


                <p
                    class="text-xs sm:text-sm font-semibold text-[#14472b] mt-2.5 tracking-wide flex items-center justify-center gap-2"
                >

                    <span class="text-[#f5a623] font-bold">|</span>
                    <span>Higher Yields</span>
                    <span class="text-[#f5a623] font-bold">|</span>
                    <span>A Stronger Future</span>
                </p>

            </div>


            <!-- =================================================
                 LOGIN CARD
                 ================================================= -->

            <div class="login-card-wrap w-full max-w-md mx-auto mobile-card">

                    class="sc-card rounded-3xl p-6 sm:p-8 relative overflow-hidden transition-all duration-300"
                >

                    <!-- Decorative Badge -->

                    <div
                        class="absolute -top-3 -right-3 w-20 h-20 rounded-full bg-[#eaf4ec] flex items-center justify-center  pointer-events-none"
                    >

                        <img class="img-wrapper"
                            src="{{ url_for('static', filename='images/sugarcane-logo.png') }}"
                            alt=""
                            
                        >

                    </div>


                    <!-- Card Header -->

                    <div class="mb-6 pr-10">

                        <h2
                            class="heading-font text-2xl sm:text-3xl font-bold text-[#08301a] tracking-tight"
                        >
                            Welcome Back
                        </h2>

                        <p
                            class="text-xs sm:text-sm text-gray-500 font-medium mt-1 leading-relaxed"
                        >
                            Login to your account and manage your sugarcane operations efficiently.
                        </p>

                    </div>


                    <!-- Existing Flask Error -->

                    {% if error %}

                    <div
                        id="alertBox"
                        class="mb-4 p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200"
                    >
                        {{ error }}
                    </div>

                    {% endif %}


                    <!-- =================================================
                         LOGIN FORM
                         ================================================= -->

                    <form
                        method="POST"
                        action="{{ url_for('login') }}"
                        id="loginForm"
                        class="space-y-4"
                    >

                        <!-- USERNAME -->

                        <div>

                            <div class="relative flex items-center">

                                <span
                                    class="absolute left-4 text-gray-400 text-sm pointer-events-none"
                                >
                                    <i class="fa-solid fa-user"></i>
                                </span>


                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    required
                                    autofocus
                                    autocomplete="username"
                                    autocapitalize="none"
                                    spellcheck="false"
                                    placeholder="Username"
                                    class="sc-input w-full pl-11 pr-4 py-3 rounded-xl border text-sm text-gray-800 placeholder-gray-400 font-medium outline-none"
                                >

                            </div>

                        </div>


                        <!-- PASSWORD -->

                        <div>

                            <div class="relative flex items-center">

                                <span
                                    class="absolute left-4 text-gray-400 text-sm pointer-events-none"
                                >
                                    <i class="fa-solid fa-lock"></i>
                                </span>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    required
                                    autocomplete="current-password"
                                    placeholder="Password"
                                    class="sc-input w-full pl-11 pr-11 py-3 rounded-xl border text-sm text-gray-800 placeholder-gray-400 font-medium outline-none"
                                >


                                <button
                                    type="button"
                                    onclick="togglePasswordVisibility()"
                                    class="absolute right-3.5 text-gray-400 hover:text-gray-600 text-sm  transition-colors focus:outline-none"
                                    title="Toggle password visibility"
                                    aria-label="Toggle password visibility"
                                >

                                    <i
                                        id="eyeIcon"
                                        class="fa-solid fa-eye-slash"
                                    ></i>

                                </button>

                            </div>

                        </div>


                        <!-- OPTIONS -->

                        <div class="flex items-center justify-between text-xs pt-1">

                            <label
                                class="flex items-center gap-2 cursor-pointer text-gray-600 font-medium select-none"
                            >

                                <input
                                    type="checkbox"
                                    id="rememberMe"
                                    name="remember"
                                    class="custom-checkbox w-4 h-4 rounded border-gray-300 text-[#0b6638] focus:ring-0 cursor-pointer"
                                >

                                <span>
                                    Remember me
                                </span>

                            </label>


                            <a
                                href="#"
                                onclick="return false;"
                                class="text-[#0b6638] hover:text-[#063e21] font-semibold hover:underline transition-colors"
                            >
                                Forgot Password?
                            </a>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            id="loginBtn"
                            class="sc-btn-primary w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2 mt-3 group cursor-pointer"
                        >

                            <span
                                id="btnText"
                                class="flex items-center gap-2"
                            >

                                <i
                                    class="fa-solid fa-right-to-bracket text-xs transition-transform group-hover:translate-x-1"
                                ></i>

                                Login

                            </span>


                            <svg
                                id="btnSpinner"
                                class="hidden animate-spin h-5 w-5 text-white"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                            >

                                <circle
                                    class="opacity-25"
                                    cx="12"
                                    cy="12"
                                    r="10"
                                    stroke="currentColor"
                                    stroke-width="4"
                                ></circle>

                                <path
                                    class="opacity-75"
                                    fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                ></path>

                            </svg>

                        </button>

                    </form>


                    <!-- SECURITY FOOTER -->

                    <div class="mt-6 pt-3 border-t border-gray-100 text-center">

                        <p
                            class="text-[11px] font-medium text-gray-400 flex items-center justify-center gap-1.5"
                        >
                            <i
                                class="fa-solid fa-lock text-[10px] text-gray-400"
                            ></i>

                            Secure • Trusted • For a Greener Tomorrow

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        function togglePasswordVisibility() {

            const passwordInput =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                eyeIcon.classList.remove(
                    "fa-eye-slash"
                );

                eyeIcon.classList.add(
                    "fa-eye"
                );

            } else {

                passwordInput.type = "password";

                eyeIcon.classList.remove(
                    "fa-eye"
                );

                eyeIcon.classList.add(
                    "fa-eye-slash"
                );
            }
        }


        /*
         * Keep the real Flask login submission.
         * We only show a spinner while the form is being submitted.
         */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function () {

                    const loginBtn =
                        document.getElementById(
                            "loginBtn"
                        );

                    const btnText =
                        document.getElementById(
                            "btnText"
                        );

                    const btnSpinner =
                        document.getElementById(
                            "btnSpinner"
                        );


                    loginBtn.disabled = true;

                    btnText.classList.add(
                        "hidden"
                    );

                    btnSpinner.classList.remove(
                        "hidden"
                    );

                }
            );

    </script>

</body>
